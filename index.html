<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Anacleto Tec</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin: 0; padding: 0; font-family: 'Roboto', sans-serif; background-color: #0b0e14; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; color: #e2e8f0; }
        .login-container { background-color: #161d2b; padding: 40px; border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); width: 100%; max-width: 450px; text-align: center; box-sizing: border-box; border-top: 4px solid #00a2ff; border-bottom: 4px solid #ff7300; }
        .logo-img { width: 220px; height: auto; margin-bottom: 20px; }
        h2 { color: #e2e8f0; font-weight: 700; margin-bottom: 30px; margin-top: 0; text-transform: uppercase; letter-spacing: 1px; }
        .input-group { margin-bottom: 20px; }
        input { width: 100%; padding: 14px; border: 1px solid #2d3748; border-radius: 4px; background-color: #0b0e14; font-size: 14px; outline: none; box-sizing: border-box; color: #e2e8f0; transition: border-color 0.3s; }
        input:focus { border-color: #00a2ff; }
        .forgot-password { display: block; text-align: left; color: #00a2ff; text-decoration: none; font-size: 13px; font-weight: bold; margin: 15px 0; }
        .btn-login { width: 100%; padding: 14px; background: linear-gradient(90deg, #ff7300, #e65c00); color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(255, 115, 0, 0.3); margin-bottom: 20px; text-transform: uppercase; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255, 115, 0, 0.4); }
        .signup-text { font-size: 14px; color: #94a3b8; }
        .signup-text a { color: #00a2ff; text-decoration: none; font-weight: bold; }
        .footer-support { margin-top: 30px; text-align: center; color: #94a3b8; font-size: 14px; line-height: 1.6; }
        .footer-support p { margin: 5px 0; }
        .footer-link { text-decoration: none; color: #e2e8f0; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; transition: color 0.3s; }
        .footer-link:hover { color: #00a2ff; }
        .whatsapp-icon { color: #25D366; font-size: 18px; }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="logo03.png" alt="Anacleto Tec" class="logo-img">
        <h2>Acesso ao Sistema</h2>
        <div class="input-group">
            <input type="text" id="username" placeholder="Usuário" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="password" placeholder="Senha" autocomplete="off">
        </div>
        <a href="#" class="forgot-password">Use suas credenciais de acesso</a>
        <button class="btn-login" id="loginBtn">ENTRAR</button>
        <p class="signup-text">Não tem uma conta? <a href="#">Solicite nos canais abaixo</a></p>
    </div>

    <div class="footer-support">
        <p>Precisa de ajuda? Contate nosso suporte</p>
        <a href="#" class="footer-link">
            <i class="fa-brands fa-whatsapp whatsapp-icon"></i> Suporte Técnico
        </a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // Verifica se já está logado, se sim, bloqueia a tela de login
        if(sessionStorage.getItem("auth") === "true") {
            window.location.replace("sistema.html");
        }

        const firebaseConfig = {
            apiKey: "AIzaSyB5g7W8l01WSQvq_Fahx32PiJfs-50LzNM",
            authDomain: "anacletotec-b655f.firebaseapp.com",
            databaseURL: "https://anacletotec-b655f-default-rtdb.firebaseio.com",
            projectId: "anacletotec-b655f",
            storageBucket: "anacletotec-b655f.firebasestorage.app",
            messagingSenderId: "652594939672",
            appId: "1:652594939672:web:4876c14dc7d943f382406d"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const loginBtn = document.getElementById('loginBtn');
        const userInp = document.getElementById('username');
        const passInp = document.getElementById('password');

        async function handleLogin() {
            const user = userInp.value;
            const pass = passInp.value;

            if (user === "admin" && pass === "1996") {
                sessionStorage.setItem("auth", "true"); // Cria a sessão
                window.location.replace("sistema.html"); // Substitui a url para bloquear o botão voltar
                return;
            }

            try {
                const q = query(collection(db, "usuarios"), where("username", "==", user), where("password", "==", pass));
                const querySnapshot = await getDocs(q);
                if (!querySnapshot.empty) {
                    sessionStorage.setItem("auth", "true"); // Cria a sessão
                    window.location.replace("sistema.html"); // Substitui a url para bloquear o botão voltar
                } else {
                    alert("Usuário ou senha inválidos!");
                }
            } catch (error) {
                console.error("Erro ao logar:", error);
                alert("Erro na conexão com o banco de dados.");
            }
        }

        loginBtn.addEventListener('click', handleLogin);
        document.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleLogin(); });
    </script>
</body>
</html>
